services:
  - type: web
    name: kaplan-ai-ready-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ALLOWED_ORIGINS
        value: https://kaplan-ai-ready.vercel.app
      - key: GEMINI_API_KEY
        sync: false
